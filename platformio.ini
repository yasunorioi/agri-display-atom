; agri-display-atom — M5Stack Atom Display (720p HDMI) agriha MQTT monitor
;
; Hardware
;   - M5Stack Atom Display (ESP32-PICO-V3-02 / PSRAM 2MB / Flash 8MB
;     / LT8618SX + Gowin GW1NR-9C FPGA, 1280x720 HDMI out, WiFi)
;   - Plug HDMI into a monitor/TV; power via USB-C (5V)
;
; Toolchain note: this is a WiFi-only node (no W5500), so it uses the same
; stable arduino-esp32 2.x stack as the sibling agri-amp-wifi
; (espressif32 6.9.0) — WiFiManager + PubSubClient + ArduinoJson are proven
; there. M5GFX bundles M5AtomDisplay.h (drives the FPGA/LT8618SX over SPI).
;
; Build / upload
;   - First flash via USB-C (native PowerShell pio.exe; git-bash MSys unsupported)
;   - Later: mDNS agri-display-01.local + HTTP OTA (added after bring-up)

[env:m5atom-display]
platform = espressif32@^6.9.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Atom Display has 8MB flash (Atom Lite board def defaults to 4MB) — use it
; so Japanese fonts + 3 skins + OTA partitions fit.
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DBOARD_HAS_PSRAM

lib_deps =
	m5stack/M5GFX@0.1.17
	tzapu/WiFiManager
	knolleary/PubSubClient
	bblanchon/ArduinoJson
